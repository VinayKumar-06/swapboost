name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --release -p swapboost
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/swapboost LICENSE README.md dist/
          tar -czf swapboost-linux-x86_64.tar.gz -C dist .
          sha256sum swapboost-linux-x86_64.tar.gz > swapboost-linux-x86_64.sha256
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/release/swapboost.exe,LICENSE,README.md dist/
          Compress-Archive -Path dist/* -DestinationPath swapboost-windows-x86_64.zip
          $hash = (Get-FileHash swapboost-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  swapboost-windows-x86_64.zip" | Out-File -Encoding ascii swapboost-windows-x86_64.sha256
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: swapboost-${{ runner.os }}-x86_64
          path: |
            swapboost-*.tar.gz
            swapboost-*.zip
            swapboost-*.sha256
