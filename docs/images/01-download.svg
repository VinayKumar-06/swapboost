<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Step 1: choose the archive for your operating system"><title>Step 1: choose the archive for your operating system</title><rect x="0" y="0" width="1200" height="520" rx="0" fill="#0b1424"/><text x="54" y="62" fill="#5ce1e6" font-size="20" font-weight="700" font-family="Arial, sans-serif">01 / DOWNLOAD</text><text x="54" y="118" fill="#f2f6fc" font-size="40" font-weight="700" font-family="Arial, sans-serif">Choose your operating system</text><text x="54" y="164" fill="#aec0d8" font-size="25" font-weight="400" font-family="Arial, sans-serif">Open Releases, then expand Assets on the v0.1.0 preview.</text><rect x="54" y="208" width="536" height="196" rx="18" fill="#142239"/><text x="80" y="254" fill="#c8f17c" font-size="23" font-weight="700" font-family="Arial, sans-serif">WINDOWS · x86-64</text><text x="80" y="305" fill="#f2f6fc" font-size="22" font-weight="400" font-family="monospace">swapboost-windows-x86_64.zip</text><text x="80" y="365" fill="#aec0d8" font-size="21" font-weight="400" font-family="Arial, sans-serif">For 64-bit Intel / AMD Windows PCs</text><rect x="610" y="208" width="536" height="196" rx="18" fill="#142239"/><text x="636" y="254" fill="#c8f17c" font-size="23" font-weight="700" font-family="Arial, sans-serif">LINUX · x86-64</text><text x="636" y="305" fill="#f2f6fc" font-size="21" font-weight="400" font-family="monospace">swapboost-linux-x86_64.tar.gz</text><text x="636" y="365" fill="#aec0d8" font-size="21" font-weight="400" font-family="Arial, sans-serif">Built on Ubuntu; other distros may vary</text><text x="54" y="464" fill="#aec0d8" font-size="23" font-weight="400" font-family="Arial, sans-serif">Choose the named executable archive, not GitHub’s “Source code” download.</text></svg>