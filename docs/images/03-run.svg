<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Step 3: run the status command from the extracted folder"><title>Step 3: run the status command from the extracted folder</title><rect x="0" y="0" width="1200" height="520" rx="0" fill="#0b1424"/><text x="54" y="62" fill="#5ce1e6" font-size="20" font-weight="700" font-family="Arial, sans-serif">03 / RUN</text><text x="54" y="118" fill="#f2f6fc" font-size="40" font-weight="700" font-family="Arial, sans-serif">Your first memory report</text><text x="54" y="162" fill="#aec0d8" font-size="25" font-weight="400" font-family="Arial, sans-serif">Type the command for your system and press Enter.</text><rect x="54" y="204" width="536" height="178" rx="18" fill="#142239"/><text x="80" y="252" fill="#c8f17c" font-size="22" font-weight="700" font-family="Arial, sans-serif">WINDOWS / POWERSHELL</text><text x="80" y="318" fill="#f2f6fc" font-size="26" font-weight="400" font-family="monospace">.\swapboost.exe status</text><rect x="610" y="204" width="536" height="178" rx="18" fill="#142239"/><text x="636" y="252" fill="#c8f17c" font-size="22" font-weight="700" font-family="Arial, sans-serif">LINUX / TERMINAL</text><text x="636" y="318" fill="#f2f6fc" font-size="26" font-weight="400" font-family="monospace">./swapboost status</text><text x="54" y="442" fill="#aec0d8" font-size="24" font-weight="400" font-family="Arial, sans-serif">No administrator access needed. No memory settings are changed.</text><text x="54" y="484" fill="#aec0d8" font-size="22" font-weight="400" font-family="Arial, sans-serif">For live sampling, replace “status” with “monitor --interval 2 --count 30”.</text></svg>