<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Step 4: interpret available RAM separately from measured pressure; illustrative data"><title>Step 4: interpret available RAM separately from measured pressure; illustrative data</title><rect x="0" y="0" width="1200" height="520" rx="0" fill="#0b1424"/><text x="54" y="62" fill="#5ce1e6" font-size="20" font-weight="700" font-family="Arial, sans-serif">04 / UNDERSTAND</text><text x="54" y="118" fill="#f2f6fc" font-size="38" font-weight="700" font-family="Arial, sans-serif">Read the signal, not just the number</text><rect x="54" y="162" width="590" height="276" rx="18" fill="#142239"/><text x="80" y="207" fill="#c8f17c" font-size="16" font-weight="700" font-family="Arial, sans-serif">ILLUSTRATION · NOT A LIVE MEASUREMENT</text><text x="80" y="258" fill="#f2f6fc" font-size="21" font-weight="700" font-family="monospace">MEMORY PRESSURE  NO ELEVATED SIGNAL</text><text x="80" y="307" fill="#f2f6fc" font-size="22" font-weight="400" font-family="monospace">Physical RAM       16.00 GiB</text><text x="80" y="349" fill="#f2f6fc" font-size="22" font-weight="400" font-family="monospace">Available RAM       4.00 GiB</text><text x="80" y="396" fill="#5ce1e6" font-size="20" font-weight="400" font-family="monospace">Available [#####---------------] 25.0%</text><text x="680" y="210" fill="#f2f6fc" font-size="24" font-weight="700" font-family="Arial, sans-serif">Pressure comes first</text><text x="680" y="250" fill="#aec0d8" font-size="20" font-weight="400" font-family="Arial, sans-serif">High RAM use alone is not a problem.</text><text x="680" y="300" fill="#f2f6fc" font-size="24" font-weight="700" font-family="Arial, sans-serif">Not measured ≠ healthy</text><text x="680" y="340" fill="#aec0d8" font-size="20" font-weight="400" font-family="Arial, sans-serif">Windows pressure is not measured yet.</text><text x="680" y="390" fill="#f2f6fc" font-size="23" font-weight="700" font-family="Arial, sans-serif">Observe the affected workload</text><text x="680" y="430" fill="#aec0d8" font-size="20" font-weight="400" font-family="Arial, sans-serif">Stop monitoring at any time with Ctrl+C.</text><text x="54" y="484" fill="#aec0d8" font-size="23" font-weight="400" font-family="Arial, sans-serif">All commands are read-only. Recommendations never apply settings.</text></svg>