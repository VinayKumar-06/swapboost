<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Step 2: extract the archive and open a terminal in the extracted folder"><title>Step 2: extract the archive and open a terminal in the extracted folder</title><rect x="0" y="0" width="1200" height="520" rx="0" fill="#0b1424"/><text x="54" y="62" fill="#5ce1e6" font-size="20" font-weight="700" font-family="Arial, sans-serif">02 / EXTRACT</text><text x="54" y="118" fill="#f2f6fc" font-size="40" font-weight="700" font-family="Arial, sans-serif">Put the files in their own folder</text><rect x="54" y="168" width="536" height="250" rx="18" fill="#142239"/><text x="80" y="214" fill="#c8f17c" font-size="23" font-weight="700" font-family="Arial, sans-serif">WINDOWS</text><text x="80" y="266" fill="#f2f6fc" font-size="23" font-weight="400" font-family="Arial, sans-serif">Right-click the ZIP → Extract All.</text><text x="80" y="312" fill="#f2f6fc" font-size="23" font-weight="400" font-family="Arial, sans-serif">Open the extracted folder.</text><text x="80" y="358" fill="#f2f6fc" font-size="23" font-weight="400" font-family="Arial, sans-serif">Use “Open in Terminal” in that folder.</text><rect x="610" y="168" width="536" height="250" rx="18" fill="#142239"/><text x="636" y="214" fill="#c8f17c" font-size="23" font-weight="700" font-family="Arial, sans-serif">LINUX</text><text x="636" y="266" fill="#f2f6fc" font-size="22" font-weight="400" font-family="Arial, sans-serif">Open Terminal in your Downloads folder.</text><text x="636" y="312" fill="#f2f6fc" font-size="22" font-weight="400" font-family="Arial, sans-serif">Create a folder; extract the tar.gz there.</text><text x="636" y="358" fill="#f2f6fc" font-size="23" font-weight="400" font-family="Arial, sans-serif">See the copyable commands below.</text><text x="54" y="474" fill="#aec0d8" font-size="22" font-weight="400" font-family="Arial, sans-serif">This is a terminal app. Double-clicking the executable can close it immediately.</text></svg>